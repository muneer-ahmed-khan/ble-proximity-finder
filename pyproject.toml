[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-proximity-finder"
version = "0.1.0"
description = "A terminal Bluetooth Low Energy proximity finder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["bleak>=3.0.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
ble-finder = "ble_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
